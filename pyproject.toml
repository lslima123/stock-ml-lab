[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-ml-lab"
version = "0.15.0"
description = "Leakage-aware machine learning experiments for financial time series."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "yfinance>=1.6,<2",
    "scikit-learn>=1.7,<2",
    "xgboost>=3.1,<4",
    "catboost>=1.2.8,<2",
    "statsmodels>=0.14.6,<0.15",
    "pmdarima>=2.1.1,<3",
    "optuna>=4.8,<5",
    "matplotlib>=3.10,<4",
    "tabulate>=0.9,<1",
    "joblib>=1.4,<2",
    "fastapi>=0.141,<0.142",
    "pydantic>=2.13,<3",
    "uvicorn[standard]>=0.52,<0.53",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "ruff>=0.12,<1", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
